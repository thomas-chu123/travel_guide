[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokyo-event-map-backend"
version = "0.1.0"
description = "FastAPI API and ingestion worker for Tokyo Event Map"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]
translation = [
  "argostranslate>=1.9,<2.0",
  "certifi>=2024.8.30",
  "opencc-python-reimplemented>=0.1.7,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: tokyo-event-map

services:
  api:
    build:
      context: ./backend
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
      target: development
    command: python -m worker.main
    env_file: .env
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./backend:/app

  web:
    build:
      context: ./frontend
      target: development
    command: npm run dev -- --host 0.0.0.0
    env_file: .env
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  frontend_node_modules:
